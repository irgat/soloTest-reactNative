name: review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  # The action exchanges an OIDC token even when it authenticates with the OAuth
  # token, so this is required or it fails before it reaches authentication.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Set CLAUDE_REVIEW to true as a repository variable in the mirror that holds
    # the token. An unset variable reads as an empty string, so this job is
    # skipped everywhere else. Never make it a required check where it is skipped.
    if: ${{ vars.CLAUDE_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0 because the brief diffs against the merge base, which a
      # shallow clone does not have. checkout writes remote-tracking refs and no
      # local branch, so the base is origin/<base_ref> and the prompt says so.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pins the Node major from .nvmrc rather than taking the runner image's.
      # No yarn cache: nothing in this job runs yarn.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Creates the comment on the pull request and gives the agent the tool
          # that writes into it. Without this it is told to comment and cannot.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.base_ref }}

            Use the pr-review subagent to review this pull request against BASE.
            Then write the subagent's report into the tracking comment,
            word for word. Do not shorten it and do not add your own summary.
          display_report: true
          # Agent is the tool that runs a subagent. Leaving it out ends the run in
          # two turns having done nothing. Task is the same tool's older name.
          #
          # Bash is scoped to read-only git subcommands plus file, which
          # reduces what a pull request can make the job run. file is on the
          # list because nothing else lets the reviewer check a binary asset's
          # format or dimensions. It prints a type description, not contents.
          #
          # It is not a boundary: git diff --no-index reads any file,
          # narrowing the allow to Bash(git diff origin/:*) did not stop it,
          # and a Read deny cannot reach a Bash command. Both were tested and
          # the reasoning is in the brief.
          #
          # The deny rule does work. It blocks a Read of the three places the
          # job's secrets sit: remote.origin.url in .git/config, the file under
          # RUNNER_TEMP that .git/config names, and /proc/self/environ, which
          # holds the OAuth token. Two leading slashes mean the filesystem
          # root; one would anchor at the working directory and match nothing.
          #
          # This list cannot make the job read only. The action adds git add,
          # commit, rm and its push script whatever we pass.
          claude_args: |
            --allowedTools "Agent,Task,Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git ls-files:*),Bash(file:*),mcp__github_comment__update_claude_comment"
            --disallowedTools "Read(.git/**),Read(//home/runner/work/_temp/**),Read(//proc/**)"
